[project]
name = "shrubbery"
description = "shrubbery"
version = "0.0.0"
authors = [
    { name = "marek-burza", email = "marek-burza@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "catboost>=1.2.10",
    "cudf-cu13>=26.8.1",
    "cuml-cu13>=25.10.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "numerai-tools>=0.7.0",
    "numerapi>=3.1.1",
    "numexpr>=2.14.1",
    "numpy>=2.4.6",
    "nvidia-modelopt>=0.46.1",
    "optuna>=4.9.0",
    "optuna-integration>=4.9.0",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "quantstats>=0.0.64",
    "requests>=2.33.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sklearn-genetic-opt>=0.13.3",
    "torch>=2.14.0",
    "tqdm>=4.68.4",
    "typer>=0.20.0",
    "xgboost>=3.4.0",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "pdbpp>=0.12.1", # Extension of Python debugger
    "pytest>=9.0.2", # Test runner
    "wat>=0.7.0", # Deep inspection of Python objects
]

[build-system]
requires = [ "uv_build>=0.12.10,<0.13" ]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"
# Kept here rather than in `dependencies` so Dependabot does not rewrite it:
# 2.5.0 removes `row_stack` which is still used by `cuml`
constraint-dependencies = [ "numpy<2.5.0" ]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132" },
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

[tool.deptry.per_rule_ignores]
# `trader.py` is a standalone PEP 723 script that carries its own inline
# tests, so it imports `pytest` while `pytest` stays a dev dependency.
DEP004 = [ "pytest" ]
